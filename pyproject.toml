[project]
name = "tsunagi"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn", "torch"]
[project.optional-dependencies]
dev = ["pytest"]
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
